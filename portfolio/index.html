<style>
body{margin:0}
#ib{--cream:#F5F3EE;
    --cream-2:#FAF7EA;
    --paper:#FFFFFF;
    --ink:#141414;
    --ink-2:#4A4844;
    --muted:#8A877F;
    --line:#E4E0D6;
    --gold:#B8962E;
    --gold-soft:#E9DDB4;
    --max:1200px;}
:where(#ib, #ib *){box-sizing:border-box;margin:0;padding:0}
#ib{font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;}
#ib a{color:inherit;text-decoration:none}
#ib .wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
#ib .wrap.top{padding-top:48px}
@container ib (max-width:560px){#ib .wrap.top{padding-top:28px}#ib .logo{height:44px}}
#ib .sec-head{flex-wrap:wrap;gap:8px 16px}
#ib .logo{height:52px;width:auto;display:block}
#ib .hero{padding:90px 0 90px}
#ib .eyebrow{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
#ib .eyebrow::before{content:"";width:24px;height:1.5px;background:var(--gold)}
#ib h1{margin-top:0;
    font-size:clamp(32px,8vw,84px);font-size:clamp(32px,7.4cqi,84px);max-width:1000px;overflow-wrap:break-word;
    font-weight:700;
    line-height:.98;
    letter-spacing:-.055em;}
#ib h1 .gold{color:var(--gold)}
#ib .lede{margin-top:28px;max-width:640px;font-size:18px;line-height:1.65;color:var(--ink-2)}
#ib .stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:80px;border-top:1px solid var(--ink)}
#ib .stat{padding:28px 24px 0 0}
#ib .stat + .stat{padding-left:24px;border-left:1px solid var(--line)}
#ib .stat .num{font-size:40px;font-weight:700;letter-spacing:-.04em}
#ib .stat .lbl{margin-top:6px;font-size:13px;color:var(--muted)}
#ib .section{padding:40px 0 60px}
#ib .sec-head{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--ink);padding-top:22px;margin-bottom:40px}
#ib .sec-title{font-size:clamp(30px,8vw,68px);font-size:clamp(30px,8cqi,68px);font-weight:700;letter-spacing:-.05em;line-height:1;margin-bottom:64px}
#ib .sec-title .gold{color:var(--gold)}
#ib #completed{margin-top:80px;background:var(--paper);padding:100px 0 120px}
#ib .sec-head span{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
#ib .sec-head .count{color:var(--gold)}
#ib .grid{display:grid;grid-auto-flow:dense;grid-template-columns:1fr 1fr;column-gap:44px;row-gap:96px}
#ib .card{display:block;cursor:pointer}
#ib .card.wide{grid-column:1 / -1}
#ib .card.video-card{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px 56px;cursor:default}
#ib .card.video-card .vid{flex:0 0 300px;max-width:100%;margin:0 auto}
#ib .vid .vbox{position:relative;width:100%;max-width:300px;aspect-ratio:9/16;height:auto;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
/* vturb makes its player taller than the video, with the video in the middle: centre it and trim the extra top and bottom */
#ib .vid .vbox vturb-smartplayer{flex:none;width:100% !important;max-width:none !important;margin:0 !important}
#ib .card.video-card .info{margin-top:0;flex:1 1 380px;min-width:0;border-top:1px solid var(--ink)}
#ib .card.video-card:hover .title{color:inherit}
#ib .video-card .more{cursor:pointer}
#ib .video-card .more:hover span{transform:translateX(4px)}

#ib .card.wide .media{aspect-ratio:auto;background:#fff;border-top:none}
#ib .card.wide .media img{height:auto}
#ib .card.wide:hover .media img{transform:none}
#ib .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--paper)}
#ib .pair figure{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:12px}
#ib .pair img{width:100%;height:100% !important;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
#ib .card:hover .pair img{transform:scale(1.03) !important}
#ib .pair figcaption, #ib .d-photos figcaption{position:absolute;top:16px;left:16px;background:#fff;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#ib .pair figcaption.gold{background:var(--gold)}
#ib .d-photos.tall figure{aspect-ratio:4/3}
@container ib (max-width:560px){#ib .pair{grid-template-columns:1fr}}
#ib .pair figure.stack{display:grid;grid-template-rows:1fr 1fr;gap:14px;border-radius:0;overflow:visible}
#ib .pair figure.stack .st{position:relative;overflow:hidden;border-radius:12px;min-height:0}
#ib .pair figure.stack img{height:100% !important}
#ib .card.wide .info{grid-template-columns:44px 1fr auto}
#ib .media{position:relative;aspect-ratio:4/3;overflow:hidden;
    background:var(--cream-2);
    border-top:3px solid var(--gold);}
#ib .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
#ib .card:hover .media img{transform:scale(1.035)}
#ib .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    background:
      repeating-linear-gradient(135deg,transparent 0 22px,rgba(184,150,46,.06) 22px 23px),
      var(--cream-2);}
#ib .placeholder .icon{width:52px;height:52px;border-radius:50%;
    border:1px solid var(--gold-soft);background:#fff;
    display:flex;align-items:center;justify-content:center;}
#ib .status-pill{position:absolute;top:18px;left:18px;
    background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 11px;}
#ib .status-pill.done{background:#fff;color:var(--ink)}
#ib .info{display:grid;grid-template-columns:44px 1fr auto;column-gap:0;border-top:1px solid var(--ink);margin-top:14px;padding-top:20px}
#ib .idx{font-size:12px;color:var(--muted);padding-top:2px}
#ib .cat{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#ib .title{margin-top:12px;font-size:clamp(28px,7vw,46px);font-size:clamp(28px,3.4cqi,46px);font-weight:700;letter-spacing:-.045em;line-height:1.02;transition:color .2s}
#ib .card:hover .title{color:var(--gold)}
#ib .meta{text-align:right;font-size:13px;line-height:1.6;color:var(--ink-2);padding-left:20px;white-space:nowrap}
#ib .meta .go{display:inline-block;margin-left:14px;color:var(--gold);transition:transform .25s}
#ib .card:hover .meta .go{transform:translate(3px,-3px)}
#ib .figure{grid-column:2 / 4;display:flex;align-items:baseline;gap:14px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
#ib .figure .amt{font-size:28px;font-weight:800;letter-spacing:-.035em}
#ib .figure .amt-lbl{font-size:13px;color:var(--muted)}
#ib .blurb{grid-column:2 / 4;margin-top:12px;font-size:15px;line-height:1.65;color:var(--ink-2);max-width:520px}
#ib .closer{background:var(--ink);color:#fff;margin-top:80px;padding:120px 0}
#ib .closer .eyebrow{color:rgba(255,255,255,.7)}
#ib .closer h2{margin-top:36px;font-size:clamp(44px,6cqi,80px);font-weight:700;letter-spacing:-.05em;line-height:1}
#ib .closer h2 .gold{color:var(--gold)}
#ib .closer .row{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
#ib .btn{display:inline-flex;align-items:center;gap:12px;background:var(--gold);color:var(--ink);padding:18px 28px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:background .2s}
#ib .btn:hover{background:#cfae47}
#ib footer{background:var(--ink);color:rgba(255,255,255,.5);font-size:12px;border-top:1px solid rgba(255,255,255,.12)}
#ib footer .wrap{display:flex;justify-content:space-between;padding-top:28px;padding-bottom:28px}
@container ib (max-width:900px){#ib .grid{grid-template-columns:1fr;row-gap:72px}
#ib .stats{grid-template-columns:1fr 1fr}
#ib .stat:nth-child(3){border-left:none;padding-left:0}
#ib .stat{padding-bottom:24px}}
@container ib (max-width:560px){#ib .wrap{padding:0 20px}
#ib .hero{padding:80px 0 60px}
#ib .info{grid-template-columns:32px 1fr}
#ib .meta{grid-column:2;text-align:left;padding-left:0;margin-top:14px;white-space:normal}
#ib .figure, #ib .blurb{grid-column:2}}
#ib .card:not(.has-details){cursor:default}
#ib .card:not(.has-details):hover .title{color:inherit}
#ib .more{grid-column:2 / 4;margin-top:18px;font-size:13px;font-weight:700;color:var(--gold);display:inline-flex;gap:8px}
#ib .more span{transition:transform .2s}
#ib .card:hover .more span{transform:translateX(4px)}
#ib #modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
#ib #modal.open{display:flex}
#ib .m-panel{position:relative;background:#fff;width:100%;max-width:940px;padding:56px 56px 48px;border-top:4px solid var(--gold);animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#ib .m-close{position:absolute;top:18px;right:20px;width:40px;height:40px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);font-family:inherit}
#ib .m-close:hover{border-color:var(--gold);color:var(--gold)}
#ib .d-cat{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#ib .d-title{margin-top:10px;font-size:clamp(36px,5cqi,56px);font-weight:700;letter-spacing:-.05em;line-height:1}
#ib .d-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:36px}
#ib .d-photos figure{position:relative;aspect-ratio:424/220;overflow:hidden;border-radius:10px;background:var(--cream-2)}
#ib .d-photos img{width:100%;height:100%;object-fit:cover;display:block}
#ib .d-photos figcaption{position:absolute;top:14px;left:14px;background:#fff;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
#ib .d-photos figcaption.gold{background:var(--gold);color:var(--ink)}
#ib .d-photos.one{grid-template-columns:1fr}
#ib .d-photos.one figure{aspect-ratio:16/8}
#ib .d-photos figure.raw{aspect-ratio:auto;border-radius:0;background:none}
#ib .d-photos figure.raw img{height:auto}
#ib .d-photos.three figure:first-child{grid-column:1 / -1;aspect-ratio:16/7}
#ib .d-row.total, #ib .d-row.gold{border-top:1.5px solid var(--ink);border-bottom:none}
#ib .d-row.total .d-l, #ib .d-row.gold .d-l{font-weight:700}
#ib .d-row.gold .d-a{color:var(--gold);font-size:20px;font-weight:800}
#ib .d-row.total + .d-row{border-top:none}
#ib .d-intro{margin-top:32px;font-size:17px;line-height:1.7;color:var(--ink-2);max-width:700px}
#ib .d-intro b{color:var(--ink)}
#ib .d-group{margin-top:36px}
#ib .d-gname{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#ib .d-row{display:flex;justify-content:space-between;gap:24px;padding:13px 0;border-bottom:1px dashed var(--line)}
#ib .d-row:last-child{border-bottom:none}
#ib .d-l{font-size:16px}
#ib .d-n{font-size:13px;color:var(--muted);margin-top:3px}
#ib .d-a{font-size:16px;font-weight:700;white-space:nowrap}
#ib .d-cash{margin-top:40px;background:var(--ink);color:#fff;padding:22px 24px;border-radius:10px}
#ib .d-cash .d-gname{margin-bottom:8px}
#ib .d-cash-v{font-size:26px;font-weight:700;letter-spacing:-.03em}
#ib .d-cash-v span{color:var(--gold)}
#ib .d-sum{margin-top:16px;background:var(--cream);border:1px solid var(--gold-soft);border-radius:10px;padding:8px 24px 4px}
#ib .d-srow{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
#ib .d-srow b{color:var(--ink)}
#ib .d-res{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
#ib .d-res span{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
#ib .d-res b{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--gold)}
@container ib (max-width:640px){#ib .m-panel{padding:56px 22px 32px}
#ib .d-photos{grid-template-columns:1fr}}
#ib{display:block;width:100%;max-width:100%;min-width:0;flex:1 1 100%;align-self:stretch;container:ib / inline-size;font-family:"DM Sans",system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;text-align:left;line-height:normal}
#ib img{max-width:100%}
#ib a{color:inherit;text-decoration:none}

#ib .pair figure.fit img.main{position:relative;z-index:1;object-fit:contain !important}
#ib .pair figure.fit img.bgfill{position:absolute;inset:0;width:100%;height:100% !important;object-fit:cover;filter:blur(18px) brightness(.85);transform:scale(1.15) !important}
#ib .card:hover .pair figure.fit img{transform:none}
#ib .card:hover .pair figure.fit img.bgfill{transform:scale(1.15) !important}
#ib .pair figure.fit figcaption{z-index:2}
</style>

/* ---------- Rendering (no need to edit below) ---------- */
projects.forEach(p=>p.pair&&p.pair.forEach(ph=>{if(ph.stackFromPhotos)ph.stack=ph.stackFromPhotos.map(k=>p.details.photos[k].src)}));
const houseIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8962E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>`;


function pageUrl(){try{return window.top.location.href}catch(e){return document.referrer||location.href}}
function fillMissing(root){
  root.querySelectorAll('img[src=""]').forEach(img=>{
    const d=document.createElement('div');d.className='placeholder';
    d.innerHTML=`<div class="icon">${houseIcon}</div>Photo coming soon`;img.replaceWith(d);
  });
}
function card(p, n){
  if(p.video){
    return `
  <div class="card video-card">
    <div class="vid">
      <div class="vbox" data-vturb-src="https://scripts.converteai.net/3b9d5e0c-cdfa-409b-9c8d-b0d07c3dcb14/players/${p.video}/v4/player.js"><vturb-smartplayer id="vid-${p.video}" style="display: block; margin: 0 auto; width: 100%;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 177.77777777777777% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer></div>
    </div>
    <div class="info">
      <div class="idx">${String(n).padStart(2,'0')}</div>
      <div>
        <div class="cat">${p.category}</div>
        <h3 class="title">${p.title}</h3>
      </div>
      <div class="meta">${p.location}<br>${p.stage}<br>${p.size}</div>
      ${p.figure ? `<div class="figure"><span class="amt">${p.figure}</span><span class="amt-lbl">${p.figureLabel}</span></div>` : ''}
      ${p.blurb ? `<p class="blurb">${p.blurb}</p>` : ''}
      ${p.details ? `<a href="#" class="more" data-idx="${projects.indexOf(p)}">Full breakdown <span>→</span></a>` : ''}
    </div>
  </div>`;
  }
  const media = p.pair
    ? `<div class="pair">${p.pair.map(ph=>ph.stack
        ? `<figure class="stack">${ph.stack.map(src=>`<div class="st"><img src="${src}" alt="${p.title} render"></div>`).join('')}<figcaption class="${ph.gold?'gold':''}">${ph.label}</figcaption></figure>`
        : `<figure class="${ph.fit?'fit':''}">${ph.fit?`<img class="bgfill" src="${ph.src}" alt="" aria-hidden="true">`:''}<img class="main" src="${ph.src}" alt="${p.title} ${ph.label}"><figcaption class="${ph.gold?'gold':''}">${ph.label}</figcaption></figure>`).join('')}</div>`
    : p.compare
    ? `<img src="${p.compare}" alt="${p.title} before and after">`
    : p.image
    ? `<img src="${p.image}" alt="${p.title}" loading="lazy">`
    : `<div class="placeholder"><div class="icon">${houseIcon}</div>Photo coming soon</div>`;
  return `
  <a class="card${p.details?' has-details':''}${(p.compare||p.pair)?' wide':''}" href="#" data-idx="${projects.indexOf(p)}">
    <div class="media">
      ${media}
      ${(p.compare||p.pair)?'':`<span class="status-pill ${p.status==='done'?'done':''}">${p.status==='done'?'Completed':'In progress'}</span>`}
    </div>
    <div class="info">
      <div class="idx">${String(n).padStart(2,'0')}</div>
      <div>
        <div class="cat">${p.category}</div>
        <h3 class="title">${p.title}</h3>
      </div>
      <div class="meta">${p.location}<br>${p.stage}<br>${p.size}<span class="go">↗</span></div>
      ${p.figure ? `<div class="figure"><span class="amt">${p.figure}</span><span class="amt-lbl">${p.figureLabel}</span></div>` : ''}
      ${p.blurb ? `<p class="blurb">${p.blurb}</p>` : ''}
      ${p.details ? `<span class="more">Full breakdown <span>→</span></span>` : ''}
    </div>
  </a>`;
}

const prog = projects.filter(p=>p.status==='progress');
const done = projects.filter(p=>p.status==='done');
let i = 0;
document.getElementById('grid-progress').innerHTML = prog.map(p=>card(p,++i)).join('');
document.getElementById('grid-done').innerHTML = done.map(p=>card(p,++i)).join('');
const plural = n => `${n} project${n===1?'':'s'}`;
document.getElementById('count-progress').textContent = plural(prog.length);
document.getElementById('count-done').textContent = plural(done.length);
fillMissing(document.getElementById('ib'));
/* Video (vturb), same setup as the working popup: load the player script once, after the box is on the page */
(function(){
  window._plt=window._plt||(performance&&performance.timeOrigin?performance.timeOrigin+performance.now():Date.now());
  var loaded={};
  document.querySelectorAll('#ib [data-vturb-src]').forEach(function(w){
    var src=w.getAttribute('data-vturb-src'); if(loaded[src]) return; loaded[src]=true;
    requestAnimationFrame(function(){var sc=document.createElement('script');sc.src=src;sc.async=true;document.head.appendChild(sc);});
  });
})();


function openDetails(p){
  const d=p.details;
  const photos=(d.photos||[]).map(ph=>ph.raw?`<figure class="raw"><img src="${ph.src}" alt="${p.title}"></figure>`:`<figure><img src="${ph.src}" alt="${ph.label}"><figcaption class="${ph.gold?'gold':''}">${ph.label}</figcaption></figure>`).join('');
  const groups=d.groups.map(g=>`<div class="d-group"><div class="d-gname">${g.name}</div>${g.items.map(([l,a,n,k])=>`<div class="d-row${k?' '+k:''}"><div><div class="d-l">${l}</div>${n?`<div class="d-n">${n}</div>`:''}</div><div class="d-a">${a}</div></div>`).join('')}</div>`).join('');
  document.getElementById('modal-body').innerHTML=`
    <div class="d-cat">${p.category}</div>
    <h2 class="d-title">${p.title}</h2>
    ${photos?`<div class="d-photos${d.photos.length===1?' one':''}${d.photos.length===3?' three':''}${p.pair?' tall':''}">${photos}</div>`:''}
    <p class="d-intro">${d.intro}</p>
    ${groups}
    ${d.cashIn?`<div class="d-cash"><div class="d-gname">Cash to get in</div><div class="d-cash-v"><span>${d.cashIn.label}</span> — ${d.cashIn.amount}</div></div>`:''}
    <div class="d-sum">
      ${d.summary.map(([l,a])=>`<div class="d-srow"><span>${l}</span><b>${a}</b></div>`).join('')}
      <div class="d-res"><span>${d.result[0]}</span><b>${d.result[1]}</b></div>
    </div>`;
  fillMissing(document.getElementById('modal-body'));
  const m=document.getElementById('modal');
  m.classList.add('open');window.__ibOv=document.body.style.overflow;document.body.style.overflow='hidden';m.querySelector('.m-panel').scrollTop=0;
}
function closeDetails(){const m=document.getElementById('modal');if(!m.classList.contains('open'))return;m.classList.remove('open');document.body.style.overflow=window.__ibOv||'';}
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');
  const m=e.target.closest('.video-card .more');
  if(m){e.preventDefault();openDetails(projects[+m.dataset.idx]);return;}
  if(c && c.classList.contains('video-card')) return;
  if(c){e.preventDefault();const p=projects[+c.dataset.idx];if(p&&p.details)openDetails(p);return;}
  if(e.target.matches('#modal, .m-close, .m-close *'))closeDetails();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails();});
</script>

<div id="modal" aria-hidden="true">
  <div class="m-panel" role="dialog" aria-modal="true">
    <button class="m-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>
</div>
</body>
